services:
  - type: worker
    name: coinswitch-futures-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py
    envVars:
      - key: CS_API_KEY
        sync: false
      - key: CS_API_SECRET_HEX  
        sync: false
      - key: CS_DRY_RUN
        value: "false"
      - key: CS_WALLET_BALANCE
        value: "1000"
      - key: CS_MAX_SYMBOLS
        value: "50"
